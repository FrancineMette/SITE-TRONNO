<!-- /public/html/admin/login.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | TRONNO</title>
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="pagina-login">

  <main>
    <div class="container-login">
      <img src="../../imagens/login.svg" alt="Logo" class="imagem-login">
      <h2>Login do Administrador</h2>

      <!-- REMOVER action/method e usar IDs -->
      <form id="formLoginAdmin" autocomplete="off">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="email@tronno.com.br" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="botao-login">Entrar</button>
      </form>

      <p id="msg" class="mensagem-esqueci" style="text-align:center;margin-top:8px;"></p>
      <p class="mensagem-esqueci"><a href="#">Esqueci minha senha</a></p>
    </div>
  </main>

  <!-- troque login.js por login-admin.js dentro de /js/admin -->
  <script src="../../js/admin/login-admin.js"></script>
</body>

<footer>
  <p>&copy; 2023 TRONNO. Todos os direitos reservados.</p>
</footer>
</html>
