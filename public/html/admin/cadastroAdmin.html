<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Administrador | TRONNO</title>
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="pagina-login">

  <main>
    <div class="container-login">
      <img src="../../imagens/login.svg" alt="Logo" class="imagem-login">
      <h2>Cadastrar Administrador</h2>

      <form id="formCadastroAdmin">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
            
        <label for="usuario">Nome de Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite o nome de usuário" required />
            
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
            
        <button type="submit" class="botao-login">Cadastrar</button>
     </form>
    </div>
  </main>

  <script src="../js/global.js"></script>
  <script src="../js/cadastro-admin.js"></script>
 
</body>

<footer>
    <p>&copy; 2023 TRONNO. Todos os direitos reservados.</p>
</footer>

</html>
